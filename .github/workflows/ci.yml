name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Testes
        run: python -m pytest